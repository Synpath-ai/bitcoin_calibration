name: Refresh Training Data

# Keeps the live paper trader's training data current. Without this, the model
# it fits on every check-in is trained on whatever data/processed/*observations*
# .parquet happened to contain the day the project was built -- discovered
# 2026-09-08, when the live model turned out to have been training on an
# Aug-26-frozen snapshot for 12 days and, plausibly as a consequence, was
# skewed heavily toward "buy NO" (mean predicted probability 0.478 against a
# market mean of 0.517; the skew vanished after refreshing to 0.506 vs 0.502).
#
# Triggered the same way as live_paper_trade.yml and for the same reason:
# GitHub's native `schedule` event delivered only 6 of ~96 expected runs over
# 16 hours on this repo, while `workflow_dispatch` fired reliably every time.
# An external cron service (cron-job.org) should POST to this workflow's
# dispatch endpoint once daily:
#
#   POST https://api.github.com/repos/Synpath-ai/bitcoin_calibration/\
#        actions/workflows/refresh_training_data.yml/dispatches
#   Accept: application/vnd.github+json
#   Authorization: Bearer <the same fine-grained PAT as live_paper_trade.yml>
#   X-GitHub-Api-Version: 2022-11-28
#   {"ref":"main"}
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-training-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clear market-discovery cache
        # get_events_page caches paginated results by (offset, params) with no
        # expiry. The LAST page of a `closed=True` walk is, by construction,
        # ever-so-slightly short (< page_size) -- that is what stops the walk.
        # Once new markets resolve, the true page at that same offset would no
        # longer be short, but the cache still returns the old short snapshot
        # forever, so the walk silently stops discovering new markets at
        # whatever the count was on first run. Clearing it forces a full
        # re-walk (a few dozen cheap paginated requests) so growth is picked
        # up. Price-history and BTC caches are untouched: those extend
        # incrementally on their own (see src/btc_client.py, src/
        # polymarket_client.py get_price_history) and full re-fetch is
        # unnecessary and slow.
        run: rm -rf data/raw/polymarket/events/*

      - name: Rediscover markets
        run: |
          python scripts/01_fetch_markets.py
          python scripts/11_fetch_hourly_markets.py

      - name: Extend BTC OHLCV
        run: |
          python scripts/02_fetch_btc.py
          python scripts/12_fetch_hourly_btc.py

      - name: Fetch price history for newly-resolved markets
        run: |
          python scripts/03_fetch_market_prices.py
          python scripts/13_fetch_hourly_prices.py

      - name: Rebuild observation datasets
        run: |
          python scripts/04_build_observations.py
          python scripts/14_build_hourly_observations.py

      - name: Commit refreshed data
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to training data."
            exit 0
          fi
          git commit -m "Refresh training data [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push refreshed training data after 5 attempts"
          exit 1

name: Live Paper Trade

# Keeps the live (simulated, no real orders) paper trader running without
# needing any local machine on. Both market families are checked on every
# fire -- the daily-family check-in is just as cheap as the hourly one (an
# API read plus model inference), so there is no reason to split them.
# Results are appended to paper_trading/*.jsonl and committed back here.
#
# ---------------------------------------------------------------------------
# WHY THERE IS NO `schedule:` TRIGGER HERE
# ---------------------------------------------------------------------------
# This workflow originally used `on: schedule` with a 10-minute cron. GitHub's
# own docs state the schedule event "can be delayed during periods of high
# loads" and that "some queued jobs may be dropped" -- and this repo hit that
# hard: over ~16 hours of a 10-minute cron, only 6 runs ever fired, at
# intervals ranging from 30 minutes to 6 hours. Config was not the problem
# (10 min is well inside the documented 5-minute minimum, Actions was enabled
# at both repo and org level, and billing was within the included allowance);
# GitHub simply was not delivering the events.
#
# `workflow_dispatch`, by contrast, fired reliably every single time. So the
# schedule now lives OUTSIDE GitHub: an external cron service (cron-job.org)
# POSTs to the REST dispatch endpoint every 10 minutes:
#
#   POST https://api.github.com/repos/Synpath-ai/bitcoin_calibration/\
#        actions/workflows/live_paper_trade.yml/dispatches
#   Accept: application/vnd.github+json
#   Authorization: Bearer <fine-grained PAT, this repo only, Actions:RW>
#   X-GitHub-Api-Version: 2022-11-28
#   {"ref":"main","inputs":{"family":"both"}}
#
# A successful dispatch returns HTTP 204 (no body). The work still runs here
# on GitHub's runners -- only the timer moved. See README.
on:
  workflow_dispatch:
    inputs:
      family:
        description: "Which market family to check-in (daily/hourly/both)"
        required: false
        default: both
        type: choice
        options: [daily, hourly, both]

permissions:
  contents: write

# Serialize runs so two jobs never race on the git push.
concurrency:
  group: live-paper-trade
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select families
        id: fam
        run: echo "families=${{ inputs.family || 'both' }}" >> "$GITHUB_OUTPUT"

      - name: Run daily check-in
        if: steps.fam.outputs.families == 'daily' || steps.fam.outputs.families == 'both'
        run: python scripts/08_live_paper_trade.py daily

      - name: Run hourly check-in
        if: steps.fam.outputs.families == 'hourly' || steps.fam.outputs.families == 'both'
        run: python scripts/08_live_paper_trade.py hourly

      - name: Commit updated paper-trading logs
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_trading/
          if git diff --cached --quiet; then
            echo "No new paper-trading log entries."
            exit 0
          fi
          git commit -m "Live paper-trade check-in [skip ci]"

          # Another check-in can land on main between our checkout and our push.
          # paper_trading/.gitattributes marks these logs `merge=union` so the
          # rebase concatenates both sides rather than conflicting, but the push
          # itself can still lose a race, so retry the whole cycle.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push paper-trading logs after 5 attempts"
          exit 1
